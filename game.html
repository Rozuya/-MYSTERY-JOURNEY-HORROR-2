<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYSTERY JOURNEY: HORROR 2</title>
  <link rel="stylesheet" href="style.css">
</head><body><main id="game">  <header class="game-header">
    <div>
      <span id="chapter">PROLOGUE</span>
      <span id="location">UNKNOWN</span>
    </div><div id="time"></div>

  </header>  <section class="story"><div id="speaker"></div>

<div id="storyText" aria-live="polite"></div>

<div id="choices"></div>

  </section>  <footer class="game-footer"><div class="stats">
  <span>🔎 <b id="clueCount">0</b></span>
  <span>🎒 <b id="itemCount">0</b></span>
  <span>📖 <b id="progress">0%</b></span>
</div>

<div class="volume-control">
  <span>🎵</span>
  <input
    id="volume"
    type="range"
    min="0"
    max="100"
    value="45"
    aria-label="Volume"
  >
  <span id="volumeValue">45%</span>
</div>

<button id="saveBtn" type="button">💾 Sauvegarder</button>
<button id="menuBtn" type="button">🏠 Menu</button>

  </footer></main><!-- =========================
     ÉCRAN DE FIN
========================= --><section id="ending" class="hidden" aria-hidden="true">  <div class="ending-content"><div id="endingIcon"></div>

<h1 id="endingTitle"></h1>

<p id="endingText"></p>

<div class="ending-buttons">
  <button id="againBtn" type="button">
    🔄 Rejouer
  </button>

  <button id="restartBtn" type="button">
    ▶ Nouvelle partie
  </button>

  <button id="endingMenuBtn" type="button">
    🏠 Menu
  </button>
</div>

  </div></section><audio id="music" loop preload="auto">
  <source src="MYSTERY JOURNEY — THE UNKNOWN.mp3" type="audio/mpeg">
</audio><div id="toast" aria-live="polite"></div><script src="save.js"></script><!-- Histoire --><script src="prologue.js"></script><script src="chapter1.js"></script><script src="chapter2.js"></script><script src="chapter3.js"></script><script src="chapter4.js"></script><script src="chapter5.js"></script><!-- Moteur du jeu --><script src="game.js"></script></body>
</html>
