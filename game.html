<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505"><title>Mystery Journey: Horror 2</title><link rel="stylesheet" href="style.css">
</head><body><div id="game"><header class="game-header"><div><small id="chapter">PROLOGUE</small>

</audio><!-- =========================
