<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>MYSTERY JOURNEY: HORROR 2</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

<header class="game-header">
<div>
<small>MYSTERY JOURNEY</small>
<h1>HORROR 2</h1>
</div>
</header>

<main>

<section class="story-box">

<div class="story-time">
THE LAST CALL
</div>

<div class="speaker">
🕵️ UNE NOUVELLE HISTOIRE
</div>

<div class="story-text">

Certaines histoires auraient dû rester oubliées.

Certains appels n'auraient jamais dû être décrochés.

Et certaines réponses auraient dû rester inconnues.

Cette fois...

le téléphone sonnera une dernière fois.

</div>

<div class="choices">

<button
class="choice"
id="newGameBtn"
type="button">
▶ Nouvelle partie
</button>

<button
class="choice"
id="continueBtn"
type="button">
💾 Continuer
</button>

</div>

</section>

</main>

</div>

<audio id="music" loop preload="auto">
<source src="The Last Call.mp3" type="audio/mpeg">
</audio>

<script>

"use strict";

const SAVE_KEY =
"mystery_journey_horror_2_save_v1";

const music =
document.getElementById("music");

function startMusic(){

if(!music)return;

music.volume=.45;

const p=music.play();

if(p)p.catch(()=>{});

}

document.addEventListener(
"click",
startMusic,
{once:true}
);

function startGame(){

try{
localStorage.removeItem(SAVE_KEY);
}catch(e){
console.error(e);
}

location.href="game.html?new=1";
}

function continueGame(){

let save=null;

try{
save=localStorage.getItem(SAVE_KEY);
}catch(e){
console.error(e);
}

location.href=save
?"game.html?continue=1"
:"game.html?new=1";
}

document
.getElementById("newGameBtn")
.addEventListener("click",startGame);

document
.getElementById("continueBtn")
.addEventListener("click",continueGame);

</script>

</body>
</html>
